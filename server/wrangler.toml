# Base Trenches Multiplayer Server
# Deploy: npx wrangler deploy

name = "base-trenches-server"
main = "index.js"
compatibility_date = "2025-09-01"

# Durable Objects
[[durable_objects.bindings]]
name = "TRENCH_ROOM"
class_name = "TrenchRoom"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "Profiles"

[[durable_objects.bindings]]
name = "EVENTS"
class_name = "Events"

# Migrations for SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
# Both SQLite-backed (required on the Workers Free plan)
new_sqlite_classes = ["TrenchRoom", "Profiles"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Events"]

# Public Privy app id (same value as js/config.js BT_PRIVY_APP_ID). Empty = Privy auth off.
[vars]
PRIVY_APP_ID = ""
# EVENTS_ADMIN_KEY is a secret:  wrangler secret put EVENTS_ADMIN_KEY

# For local development
[dev]
port = 8787

# Production environment (uncomment and configure after first deploy)
# [env.production]
# name = "base-trenches-server"
