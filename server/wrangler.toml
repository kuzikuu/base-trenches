# Base Trenches Multiplayer Server
# Deploy: npx wrangler deploy

name = "base-trenches-server"
main = "index.js"
compatibility_date = "2025-09-01"

# Durable Objects
[[durable_objects.bindings]]
name = "TRENCH_ROOM"
class_name = "TrenchRoom"

[[durable_objects.bindings]]
name = "PROFILES"
class_name = "Profiles"

[[durable_objects.bindings]]
name = "EVENTS"
class_name = "Events"

# Power of 9: in-game hot list, feed, meter/boost and the daily/weekly/all-time boards (one instance).
[[durable_objects.bindings]]
name = "PULSE"
class_name = "Pulse"

# Migrations for SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
# Both SQLite-backed (required on the Workers Free plan)
new_sqlite_classes = ["TrenchRoom", "Profiles"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Events"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Pulse"]

# Public Privy app id (same value as js/config.js BT_PRIVY_APP_ID). Empty = Privy auth off.
# Server verifies Privy JWTs with the public JWKS only; the Privy app secret is NOT needed here.
[vars]
PRIVY_APP_ID = "cmvrnxkao009s0hl58gy61ylg"
# Endless levels switch. "0" = level 1 only (production until the launch announcement).
# The preview worker runs with "1". Flip to "1" here (or in the dashboard) to open levels 2+.
LEVELS_UNLOCKED = "0"
# Power of 9 meter points per charge (default 99). Hot-list tickers come from the bot's /api/hot.
# P9_METER_MAX = "99"
# BOT_URL = "https://base-trenches-bot.base-trenches.workers.dev"
# EVENTS_ADMIN_KEY is a secret:  wrangler secret put EVENTS_ADMIN_KEY

# For local development
[dev]
port = 8787

# Production environment (uncomment and configure after first deploy)
# [env.production]
# name = "base-trenches-server"
